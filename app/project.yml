name: FindMy
options:
  bundleIdPrefix: com.apple
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
targets:
  FindMy:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # 第三方整包排除，改为下面【逐文件精确加入】
          - "Render/imgui/**"
          # M3: kfd 闭包同样逐文件加入（见 docs/kfd-移植清单.md 第 1 节）。
          # vendor/ 只放「上游原样文件」，仅用于人工 diff / 生成 patch，绝不参与编译。
          - "Kernel/kfd/vendor/**"
      # ── ImGui：只编这 6 个（其余 backends/*.cpp 是 dx/glfw/vulkan，编了必炸）──
      - path: Sources/Render/imgui/imgui.cpp
      - path: Sources/Render/imgui/imgui_draw.cpp
      - path: Sources/Render/imgui/imgui_tables.cpp
      - path: Sources/Render/imgui/imgui_widgets.cpp
      - path: Sources/Render/imgui/imgui_demo.cpp
      - path: Sources/Render/imgui/backends/imgui_impl_metal.mm
      # ── M3: KFD 内核链 ────────────────────────────────────────────────
      # 桥接层：MFKernelBridge.m 是【全工程唯一】include "libkfd.h" 的编译单元。
      # libkfd.h 是 header-only（kopen/kread/kwrite/kclose/kfd_init 都是
      # 无 static 的普通定义），被两个 TU 包含 = 重复符号。
      #
      # 为什么是 .m 而不是 .c：
      #   libkfd.h → info.h → info/dynamic_info.h → fun/kpf/patchfinder.h
      #   最后一行是 #import <Foundation/Foundation.h>。
      #   纯 C（.c）编译单元吃不下 ObjC 模块，会报
      #     "Module 'ObjectiveC.NSObject' requires feature 'objc'"
      #     "Could not build module 'Foundation'"
      #   .m（ObjC，非 ObjC++）可以。min/max 宏在 .m 下无害 —— 只有
      #   ObjC++（.mm）才会与 libc++ 的 std::min/std::max 冲突。
      # 另外单独关掉 ARC：本文件用 setjmp/longjmp，且无任何 ObjC 对象。
      - path: Sources/Kernel/MFKernelBridge.m
        compilerFlags: -fno-objc-arc
      - path: Sources/Kernel/MFKernelBridge.h
      # 注意：MFLibkfdHost.c 不存在 —— MFLibkfdKRead4() 的实现放在
      # MFKernelBridge.c（行 535）里，避免第二个 TU 也 include libkfd.h。
      # 这里只列头文件，给 libdimentio.m 提供原型。
      - path: Sources/Kernel/MFLibkfdHost.h
      # kfund 的运行时 patchfinder（.m 必须显式列出，否则 Core KPF 起不来）
      - path: Sources/Kernel/kfd/fun/kpf/patchfinder.m
      - path: Sources/Kernel/kfd/fun/kpf/libdimentio.m
      # libkfd.h 是 MFKernelBridge.c 直接 include 的入口，显式列出保证被 XcodeGen 看见
      - path: Sources/Kernel/kfd/libkfd.h
      - path: Resources
        buildPhase: resources
    # ── 系统框架 / 库（XcodeGen 不会自动加，必须显式声明）──
    dependencies:
      # M0 必需
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      # [M5.137] 名字解码用 CFStringCreateWithBytes（UTF-8 失败时走 GB18030 兜底）
      - sdk: CoreFoundation.framework
      # M1：清理 Key 走 sqlite3
      - sdk: libsqlite3.tbd
      # M2：ImGui → Metal 渲染链
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      # M3：libdimentio.m L17 `#include <compression.h>` + L253 compression_decode_buffer()
      #     iOS 上该符号由 libcompression 提供（libSystem 是否 re-export 依 SDK 版本
      #     而异，显式链接最稳；重复链接无害）。
      - sdk: libcompression.tbd
      # M5.80：环境检测用 SecTaskCopyValueForEntitlement 读「系统实际生效」的权限
      #       （只看 IPA 里声明的没用，要问系统认不认这份签名）
      - sdk: Security.framework
      # [M5.229] Game/MFDeviceIdentity.mm 用 CC_SHA256 生成设备指纹。
      #          CommonCrypto 是独立 framework（不在 libSystem 的隐式导出里），
      #          不声明就会在链接阶段 undefined symbol _CC_SHA256。
      - sdk: CommonCrypto.framework
    settings:
      base:
        PRODUCT_NAME: FindMy
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.findmy
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LIBRARY: libc++
        CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
        GCC_WARN_UNDECLARED_SELECTOR: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources"
          - "$(SRCROOT)/Sources/Render/imgui"
          - "$(SRCROOT)/Sources/Render/imgui/backends"
          # M3：上游 kfd 的 libkfd.h 内部按 "libkfd/common.h" 相对包含，
          # 所以搜索路径必须指向 .../Kernel/kfd（libkfd.h 所在目录），
          # 而不是旧的 .../Kernel/kfd/kfd。
          - "$(SRCROOT)/Sources/Kernel/kfd"
          # MFKernelBridge.c 里写的是 "kfd/libkfd.h" / "kfd/fun/kpf/patchfinder.h"
          - "$(SRCROOT)/Sources/Kernel"
        # M3：libkfd 的读写后端大量使用 sem_open / syscall / ioctl / open 等
        # 已标记 deprecated 的 API；上游 macOS Makefile 也是靠这个开关静音的。
        OTHER_CFLAGS:
          - "$(inherited)"
          - "-Wno-deprecated-declarations"
          # kpf/libdimentio.h 等使用旧式空参数表声明风格，clang 15+ 会报
          # -Wdeprecated-non-prototype；本工程未开 -Werror，所以那个警告即使
          # 冒出来也不会失败，这里顺手压掉。若工具链不认识该选项，删掉这一行即可。
          - "-Wno-deprecated-non-prototype"
        # 云构建不签名（构建后由 CI 用 ldid + entitlements 伪签名）
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        # 真机 Release 产物（arm64）
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64
        VALIDATE_PRODUCT: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  FindMy:
    build:
      targets:
        FindMy: all
    run:
      config: Release
