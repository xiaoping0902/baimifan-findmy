name: FindMy
options:
  bundleIdPrefix: com.apple
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
targets:
  FindMy:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # 第三方整包排除，改为下面【逐文件精确加入】
          - "Render/imgui/**"
          - "Kernel/kfd/**"
          - "Kernel/kfund/**"
      # ── ImGui：只编这 6 个（其余 backends/*.cpp 是 dx/glfw/vulkan，编了必炸）──
      - path: Sources/Render/imgui/imgui.cpp
      - path: Sources/Render/imgui/imgui_draw.cpp
      - path: Sources/Render/imgui/imgui_tables.cpp
      - path: Sources/Render/imgui/imgui_widgets.cpp
      - path: Sources/Render/imgui/imgui_demo.cpp
      - path: Sources/Render/imgui/backends/imgui_impl_metal.mm
      - path: Resources
        buildPhase: resources
    # ── 系统框架 / 库（XcodeGen 不会自动加，必须显式声明）──
    dependencies:
      # M0 必需
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      # M1：清理 Key 走 sqlite3
      - sdk: libsqlite3.tbd
      # M2：ImGui → Metal 渲染链
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_NAME: FindMy
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.findmy
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_C_LANGUAGE_STANDARD: gnu17
        CLANG_CXX_LIBRARY: libc++
        CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
        GCC_WARN_UNDECLARED_SELECTOR: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources"
          - "$(SRCROOT)/Sources/Render/imgui"
          - "$(SRCROOT)/Sources/Render/imgui/backends"
          - "$(SRCROOT)/Sources/Kernel/kfd/kfd"
        # 云构建不签名（构建后由 CI 用 ldid + entitlements 伪签名）
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        # 真机 Release 产物（arm64）
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64
        VALIDATE_PRODUCT: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  FindMy:
    build:
      targets:
        FindMy: all
    run:
      config: Release
