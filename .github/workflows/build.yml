name: Build Unsigned IPA

on:
  # 任何分支推送都构建：分支太多、又装不了 gh CLI，
  # 每次都要人去网页点 Run workflow 太慢。main 仍然会被包含。
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    # 需要写权限：构建完成后把 IPA 附到 Release 上，
    # 这样下载链接是【匿名可用】的（artifact 下载必须要 token，
    # 而我们这台 Windows 机器没有 gh、API 额度也常被共享 IP 用光）。
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install xcodegen & ldid
        run: brew install xcodegen ldid

      - name: Check source and entitlement regression tests
        # 注意：必须在仓库根目录跑 —— tests/ 与 scripts/ 都在根下，
        # 不能加 working-directory: app（加了就会 ImportError: 'tests' 不可导入）
        run: |
          set -eo pipefail
          ( python3 -m unittest discover -s tests -p 'test_ipa_entitlements.py' -v
            python3 tests/run_uipanel_regressions.py
            python3 scripts/preflight.py ) 2>&1 | tee app/build.log

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate 2>&1 | tee -a build.log

      - name: Build (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          # 全量日志落到 build.log：失败时会被挂到 Release，供外部读取编译报错
          xcodebuild \
            -project FindMy.xcodeproj \
            -scheme FindMy \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Locate .app
        id: locate
        working-directory: app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"
          ls -la "$APP"

      # ★ [M5.24] 把版本号与 Git 提交号注入 Info.plist
      #
      # 起因：用户和分析者的建议 ——
      #   「当前安装信息一直写着 1.0.0 / 1，建议给每次构建加上独立的版本号
      #     或 Git 提交号，并在启动日志里打印，方便确认实际运行的是哪一版。」
      #
      # 这个问题真发生过：M5.21 明明加了「自造 CAContext（核心修复）」，
      # 但拉到的日志里没有 —— 分不清是没装、装错包，还是代码没跑到。
      # 注入之后，启动日志会打出版本 + 提交号 + run number，一眼对上。
      - name: Stamp version (git SHA + run number)
        id: stamp
        working-directory: app
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          PB=/usr/libexec/PlistBuddy
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NO="${{ github.run_number }}"
          MILE="M5.$RUN_NO"

          # CFBundleShortVersionString 用语义化里程号；CFBundleVersion 用 run number
          $PB -c "Set :CFBundleShortVersionString $MILE" "$APP/Info.plist"
          $PB -c "Set :CFBundleVersion $RUN_NO" "$APP/Info.plist"
          # 自加的键：完整提交号 + 构建时间，启动日志里会打出来
          $PB -c "Add :MFBuildStamp string ${SHORT_SHA}-r${RUN_NO}" "$APP/Info.plist" 2>/dev/null \
            || $PB -c "Set :MFBuildStamp ${SHORT_SHA}-r${RUN_NO}" "$APP/Info.plist"
          $PB -c "Add :MFBuildSHA string ${{ github.sha }}" "$APP/Info.plist" 2>/dev/null \
            || $PB -c "Set :MFBuildSHA ${{ github.sha }}" "$APP/Info.plist"

          echo "=== 注入结果 ==="
          $PB -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          $PB -c "Print :CFBundleVersion" "$APP/Info.plist"
          $PB -c "Print :MFBuildStamp" "$APP/Info.plist"

      - name: Inject entitlements (ldid)
        working-directory: app
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          ENT="$PWD/Support/entitlements.plist"
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "Executable: $EXEC_NAME"

          # ── [M5.91] 用「空 requirements」签，别让 ldid 自造 DR ──
          #
          # 原因（见 白米饭复刻/docs 与 白米饭-taskport-真相 的交叉验证）：
          #   ldid 不带 -Q 时会自动生成一条开发证书指定要求
          #   （ldid.cpp:2062-2089），形如
          #     identifier "FindMy" and anchor apple generic and ...
          #   而 TrollStore 重签时按 kSecCSPreserveRequirements 把这条
          #   CS_REQUIREMENTS **原样保留**（codesign.m:127），于是一路活到设备上。
          #   问题是 ad-hoc 签名永远满足不了 "anchor apple generic"，
          #   等于给自己挂了一条注定失败的设计要求。
          #
          #   白米饭那边这一项是 **12 字节空要求**：
          #     fa de 0c 01 00 00 00 0c 00 00 00 00
          #   我们照做，逐字节对齐。
          EMPTY_REQ=/tmp/mf_empty.req
          printf '\xfa\xde\x0c\x01\x00\x00\x00\x0c\x00\x00\x00\x00' > "$EMPTY_REQ"

          ldid -S"$ENT" -Q"$EMPTY_REQ" "$APP/$EXEC_NAME"
          echo "--- entitlements 验证 ---"
          ldid -e "$APP/$EXEC_NAME"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f | while read -r bin; do
              if file -b "$bin" | grep -q "Mach-O"; then
                ldid -S"$ENT" -Q"$EMPTY_REQ" "$bin"
                echo "signed: $bin"
              fi
            done
          fi

      - name: Verify entitlements + identity (fail fast)
        working-directory: app
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          ldid -e "$APP/$EXEC_NAME" > /tmp/mf_ent.plist || true
          echo "=== entitlements 逐条核对 ==="
          fail=0
          for k in platform-application \
                   com.apple.private.security.no-sandbox \
                   com.apple.private.security.storage.AppBundles \
                   com.apple.private.persona-mgmt \
                   com.apple.springboard.accessibility-window-hosting \
                   task_for_pid-allow \
                   com.apple.security.exception.iokit-user-client-class ; do
            if grep -q "$k" /tmp/mf_ent.plist; then echo "  ✓ $k"; else echo "  ✗ $k"; fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::entitlements 注入不完整 —— 装机后权限不会生效"
            exit 1
          fi

          # ── [M5.91] 验 CS_REQUIREMENTS 必须是 12 字节空要求 ──
          #
          # 只查 entitlement 字符串是不够的：ldid 生成的 DR 会带一条
          # "anchor apple generic"，ad-hoc 签名永远满足不了它，
          # 而 TrollStore 重签会把它保留到设备上。
          #
          # 解析逻辑放在 scripts/verify_requirements.py（Mach-O → SuperBlob → slot 2）。
          python3 ../scripts/verify_requirements.py "$APP/$EXEC_NAME"

          echo "=== 伪装身份核对 ==="
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "  显示名: $NAME"
          echo "  Bundle : $ID"
          echo "  可执行 : $EXE"
          [ "$ID" = "com.apple.findmy" ] || { echo "::error::Bundle ID 不对: $ID"; exit 1; }
          [ "$EXE" = "FindMy" ]          || { echo "::error::可执行名不对: $EXE"; exit 1; }

          echo "=== 架构核对 ==="
          lipo -info "$APP/$EXEC_NAME"
          file "$APP/$EXEC_NAME"
          ARCH=$(lipo -info "$APP/$EXEC_NAME" | grep -o 'arm64' | head -1)
          [ "$ARCH" = "arm64" ] || { echo "::error::缺少 arm64 slice —— 真机装不上"; exit 1; }

          echo "✅ 全部核对通过"

      - name: Package IPA
        working-directory: app
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry FindMy-unsigned.ipa Payload
          ls -la
          echo "--- 结构校验 ---"
          unzip -l FindMy-unsigned.ipa | head -20

      - name: Reject IPA with incompatible TrollStore entitlements
        run: python3 scripts/verify_ipa.py app/out/FindMy-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindMy-unsigned-ipa
          path: app/out/FindMy-unsigned.ipa
          if-no-files-found: error

      # 把「IPA + 构建日志」一起挂到公开 Release。
      #
      # 为什么这么做：
      #   artifact 下载强制要登录；Release 资产是【匿名可下载】的。
      #   而构建失败时没有 IPA，但 build.log 在 —— 外部（Windows、无 gh）只要
      #   拉 releases.atom 拿到 tag，就能拼出确定性 URL：
      #     https://github.com/OWNER/REPO/releases/download/<tag>/build.log
      #     https://github.com/OWNER/REPO/releases/download/<tag>/FindMy-unsigned.ipa
      #   if: always() 保证失败时也会发布，从而能远程看到编译报错原文。
      - name: Publish IPA and build log to public release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: IPA build #${{ github.run_number }} (${{ github.sha }})
          body: |
            自动构建产物（未签名，用 Sideloadly / TrollStore 安装）。
            commit: ${{ github.sha }}
            branch: ${{ github.ref_name }}
            result: ${{ job.status }}
          files: |
            app/out/FindMy-unsigned.ipa
            app/build.log
          fail_on_unmatched_files: false
