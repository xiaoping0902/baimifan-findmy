name: HUD regression tests
on:
  workflow_dispatch:
  push:
    branches: [fix/hud-context-startup, fix/hud-reliability]
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject entitlements that prevent TrollStore app launch
        run: python3 -m unittest discover -s tests -p 'test_ipa_entitlements.py' -v
      - name: Exercise context ownership and startup reports
        run: bash tests/run_hud_regressions.sh
  uikit:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [input, windows, menu, overlay]
    steps:
      - uses: actions/checkout@v4
      - name: Replay device touches through the production HID bridge
        run: python3 tests/run_hud_uikit_regressions.py --suite ${{ matrix.suite }}
